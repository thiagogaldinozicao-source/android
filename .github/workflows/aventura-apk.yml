name: build-apk
on:
  push:
    paths: ["aventura-do-zicao/**", ".github/workflows/aventura-apk.yml"]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    defaults: { run: { working-directory: aventura-do-zicao } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/*.apk AventuraDoZicao.apk
      - uses: actions/upload-artifact@v4
        with: { name: AventuraDoZicao, path: aventura-do-zicao/AventuraDoZicao.apk }
      - name: Commit APK
        run: |
          mkdir -p ../dist && cp AventuraDoZicao.apk ../dist/
          cd .. && git config user.name "github-actions" && git config user.email "actions@github.com"
          git add dist/AventuraDoZicao.apk && git commit -m "APK [skip ci]" && git push
