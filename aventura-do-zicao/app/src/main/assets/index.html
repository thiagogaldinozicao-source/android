const kb={},ax={},gpH={};let held={},prev={},tap={};const evTap=new Set();
function act(a,d){ if(d){ if(!kb[a]) evTap.add(a); kb[a]=true; } else kb[a]=false; audioInit(); }
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowDown:'down',KeyS:'down',
  ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyZ:'jump',KeyK:'jump',Enter:'jump',NumpadEnter:'jump',
  KeyX:'attack',KeyJ:'attack',ShiftLeft:'attack',ShiftRight:'attack',Escape:'pause',KeyP:'pause',Backspace:'back'};
function keyAct(e){return KEYMAP[e.code]||(e.keyCode===13?'jump':e.keyCode===37?'left':e.keyCode===39?'right':e.keyCode===38?'jump':e.keyCode===40?'down':null);}

addEventListener('keyup',e=>{const a=keyAct(e);if(a){e.preventDefault();act(a,false);}});

const NK={19:'jump',20:'down',21:'left',22:'right',23:'jump',66:'jump',160:'jump',96:'jump',62:'jump',
  97:'attack',98:'attack',99:'attack',100:'attack',101:'attack',102:'attack',103:'attack',104:'attack',105:'attack',106:'attack',107:'jump',
  108:'pause',82:'pause',109:'pause',4:'back',111:'back'};
window.__key=(c,d)=>{const a=NK[c];if(a)act(a,!!d);};
window.__axis=(x,y,hx,hy)=>{ax.left=x<-.45||hx<-.5;ax.right=x>.45||hx>.5;ax.down=y>.65||hy>.5;audioInit();};
function pollPads(){
  for(const k in gpH) gpH[k]=false;
  let pads=[]; try{pads=navigator.getGamepads?navigator.getGamepads():[]}catch(e){}
  for(const g of pads){ if(!g) continue;
    const b=i=>g.buttons[i]&&g.buttons[i].pressed; const x=g.axes[0]||0,y=g.axes[1]||0;
    if(b(0)) gpH.jump=true;
    if(b(1)||b(2)||b(3)||b(4)||b(5)||b(7)) gpH.attack=true;
    if(b(9)) gpH.pause=true; if(b(8)) gpH.back=true;
    if(b(14)||x<-.45) gpH.left=true; if(b(15)||x>.45) gpH.right=true; if(b(13)||y>.65) gpH.down=true;
  }
}
function clearInputs(){for(const k in kb)kb[k]=false;for(const k in ax)ax[k]=false;for(const k in gpH)gpH[k]=false;if(window.tch)for(const k in tch)tch[k]=false;}
addEventListener('blur',clearInputs);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInputs();});
function readInput(){
  pollPads(); prev=held; held={};
  for(const a of ACTS) held[a]=!!(kb[a]||ax[a]||gpH[a]);
  tap={}; for(const a of ACTS) if(held[a]&&!prev[a]) tap[a]=true;
  for(const a of evTap) tap[a]=true; evTap.clear();
}

/* ================= AUDIO ================= */
let AC=null,master=null;
function audioInit(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.45;master.connect(AC.destination);}catch(e){AC=null}}
  if(AC&&AC.state==='suspended') AC.resume();
}
function tone(f,d,type,v,slide,delay){
  if(!AC) return; const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v||.1,t); g.gain.exponentialRampToValueAtTime(.0008,t+d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.03);
}

  stomp(){tone(240,.14,'square',.13,-160)}, hurt(){tone(320,.35,'sawtooth',.12,-230)},
  shot(){tone(760,.12,'triangle',.16,-420)}, spring(){tone(180,.38,'triangle',.22,760)},
  block(){tone(150,.1,'square',.13,70)}, pop(){tone(600,.08,'sine',.15,300)},
  check(){[523,659,784].forEach((f,i)=>tone(f,.15,'square',.08,0,i*.09))},
  win(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.22,'square',.09,0,i*.12))},
  die(){[392,330,262,196].forEach((f,i)=>tone(f,.22,'triangle',.18,0,i*.14))},

  select(){tone(660,.07,'square',.08)}, pause(){tone(440,.08,'square',.08);tone(660,.1,'square',.08,0,.08)}

const mus={on:false,song:null,step:0,next:0};
function musicStart(i,rate){mus.rate=rate||1;mus.song=SONGS[i];mus.step=0;mus.on=true;mus.next=AC?AC.currentTime+.08:0;}
function musicStop(){mus.on=false;}
function musicTick(){
  if(!AC||!mus.on||AC.state!=='running') return;
  if(mus.next<AC.currentTime) mus.next=AC.currentTime+.05;
  const s=mus.song,sp=60/(s.bpm*(mus.rate||1))/2;
  while(mus.next<AC.currentTime+.25){
    const i=mus.step%s.lead.length,n=s.lead[i],dl=mus.next-AC.currentTime;
    if(n!=null) tone(mf(s.key+n),sp*.9,'square',.035,0,dl);
    if(i%2===0){const bar=Math.floor(i/8)%s.bass.length;const bm=s.key-24+s.bass[bar]+(i%4===2?12:0);tone(mf(bm),sp*1.8,'triangle',.11,0,dl);}
    if(i%4===2) tone(2400,.03,'square',.012,-1800,dl);
    mus.step++; mus.next+=sp;
  }
}

const tch={}; let touchUI=false;
const TBTN=[{a:'left',x:62,y:462,r:56,l:'◀'},{a:'right',x:258,y:462,r:56,l:'▶'},{a:'down',x:160,y:500,r:40,l:'▼'},{a:'attack',x:745,y:470,r:56,l:'B'},{a:'jump',x:870,y:410,r:64,l:'A'},{a:'pause',x:W/2,y:40,r:28,l:'II'}];
function handleTouches(e){
  e.preventDefault(); touchUI=true; audioInit();
  const r=cv.getBoundingClientRect(); const was={}; for(const b of TBTN){ was[b.a]=tch[b.a]; tch[b.a]=false; }
  for(const t of e.touches){
    const x=(t.clientX-r.left)/r.width*W, y=(t.clientY-r.top)/r.height*H;
    let best=null,bd=1e9;
    for(const b of TBTN){ const d=Math.hypot(x-b.x,y-b.y); if(d<b.r*1.05&&d<bd){bd=d;best=b;} }
    if(best) tch[best.a]=true;
  }
  for(const b of TBTN) if(tch[b.a]&&!was[b.a]&&!kb[b.a]) evTap.add(b.a);
  if(e.type==='touchstart'&&state!=='play'){
    for(const t of e.changedTouches){ const x=(t.clientX-r.left)/r.width*W, y=(t.clientY-r.top)/r.height*H;
      if(!TBTN.some(b=>Math.hypot(x-b.x,y-b.y)<b.r*1.05)) evTap.add('jump'); }
  }
}
['touchstart','touchmove','touchend','touchcancel'].forEach(ev=>cv.addEventListener(ev,handleTouches,{passive:false}));

    ctx.globalAlpha=tch[b.a]?.55:.3; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();

}

/* ================= PHYSICS ================= */
function moveX(e,dx){
  e.x+=dx; const top=Math.floor(e.y/T),bot=Math.floor((e.y+e.h-.01)/T);
  if(dx>0){const tx=Math.floor((e.x+e.w-.01)/T);for(let ty=top;ty<=bot;ty++)if(solid(tx,ty)){e.x=tx*T-e.w;return true;}}
  else if(dx<0){const tx=Math.floor(e.x/T);for(let ty=top;ty<=bot;ty++)if(solid(tx,ty)){e.x=(tx+1)*T;return true;}}
  return false;
}
function moveY(e,dy){
  const prevBot=e.y+e.h; e.y+=dy;
  const l=Math.floor(e.x/T),r=Math.floor((e.x+e.w-.01)/T);
  if(dy>0){const ty=Math.floor((e.y+e.h-.01)/T);
    for(let tx=l;tx<=r;tx++){const c=tileAt(tx,ty);
      if(solid(tx,ty)||(c==='='&&prevBot<=ty*T+.5)){e.y=ty*T-e.h;return {hit:'down'};}}}
  else if(dy<0){const ty=Math.floor(e.y/T); let best=null;
    for(let tx=l;tx<=r;tx++) if(solid(tx,ty)){const ov=Math.min(e.x+e.w,(tx+1)*T)-Math.max(e.x,tx*T); if(!best||ov>best.ov) best={tx,ov};}
    if(best){e.y=(ty+1)*T;return {hit:'up',tx:best.tx,ty};}}
  return null;
}

function updateAct(dt){

  if(A.dmg&&A.h0!=null&&a.t>=A.h0&&a.t<=A.h1){

function drawCoin(x,y,t){
  const w=Math.abs(Math.cos(t))*13+2;
  ctx.fillStyle='#e09a00';ctx.beginPath();ctx.ellipse(x,y,w,17,0,0,7);ctx.fill();
  ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.ellipse(x,y,Math.max(1,w-3),14,0,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(x-w*.35,y-8,Math.max(1,w*.25),12);
}
function drawPhone(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#222';rr(-16,-30,32,60,7);ctx.fill();ctx.strokeStyle='#ccc';ctx.lineWidth=2;rr(-16,-30,32,60,7);ctx.stroke();
  const g=ctx.createLinearGradient(-12,-26,12,26);g.addColorStop(0,'#5cc4ff');g.addColorStop(1,'#b16bff');ctx.fillStyle=g;rr(-12,-25,24,50,4);ctx.fill();
  ctx.fillStyle='#111';rr(-5,-24,10,4,2);ctx.fill();ctx.restore();
}
function drawGlow(x,y,r,col){ctx.drawImage(glowCanvas(r,col),x-r,y-r);}
function drawWorld(){
  drawBG(lv.theme,cam.x,cam.y,time);
  const sx=(Math.random()-.5)*cam.shake,sy=(Math.random()-.5)*cam.shake;
  ctx.save();ctx.translate(-Math.round(cam.x)+sx,-Math.round(cam.y)+sy);
  if(!lv.gGrad){lv.gGrad=ctx.createLinearGradient(0,lv.h*T-110,0,lv.h*T);lv.gGrad.addColorStop(0,'rgba(10,0,30,0)');lv.gGrad.addColorStop(1,'rgba(10,0,30,.75)');}
  ctx.fillStyle=lv.gGrad;ctx.fillRect(cam.x-20,lv.h*T-110,W+40,110);
  drawDeco(); drawTiles();
  const A=lv.arena; if(A&&A.on){ for(const x of [A.x0,A.x1]){ctx.fillStyle='rgba(255,60,60,.25)';ctx.fillRect(x-6,0,12,lv.h*T);} }
  for(const m of lv.plats){ if(m.k==='f'){ if(m.st===3) continue; const jx=m.st===1?(Math.random()-.5)*4:0; ctx.fillStyle='#8a5a3a';rr(m.x+jx,m.y,m.w,m.h,5);ctx.fill();ctx.fillStyle='#d9a46a';rr(m.x+jx,m.y,m.w,9,4);ctx.fill();ctx.strokeStyle='#5a3a20';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m.x+jx+10,m.y+4);ctx.lineTo(m.x+jx+38,m.y+14);ctx.stroke(); continue;}
    ctx.fillStyle='#6f4a2a';rr(m.x,m.y,m.w,m.h,6);ctx.fill();ctx.fillStyle=m.k==='v'?'#7df':'#ffcc4d';rr(m.x,m.y,m.w,10,5);ctx.fill();
    ctx.fillStyle='#6f4a2a';for(let i=1;i<4;i++)ctx.fillRect(m.x+i*m.w/4,m.y+2,3,6);}
  for(const s of lv.springs){const sq=Math.sin(s.sq*Math.PI)*10;
    ctx.strokeStyle='#555';ctx.lineWidth=4;ctx.beginPath();for(let i=0;i<4;i++){const yy=s.y+8+i*((18-sq*.4)/4)+sq*.6;ctx.moveTo(s.x+6,yy);ctx.lineTo(s.x+s.w-6,yy+3);}ctx.stroke();
    ctx.fillStyle='#ff3b3b';rr(s.x,s.y-2+sq*.5,s.w,10,4);ctx.fill();ctx.fillStyle='#ff9a9a';ctx.fillRect(s.x+4,s.y+sq*.5,s.w-8,3);
    ctx.fillStyle='#555';rr(s.x+2,s.y+20,s.w-4,6,3);ctx.fill();}
  for(const c of lv.checks){ if(c.on){ctx.save();ctx.globalCompositeOperation='lighter';drawGlow(c.x,c.y-80,70,'rgba(120,255,150,.35)');ctx.restore();}
    spr('it_flagc',c.x-10,c.y+4,1,1,c.on?1:.55); }
  if(lv.flag){const f=lv.flag; const open=!lv.arena||lv.arena.done;
    spr('it_flagf',f.x+20,f.y+6,1,1,open?1:.35); if(!open){text('🔒',f.x+20,f.y-120,40,'#fff','center',false);} }
  for(const c of lv.coins) if(!c.got&&c.x>cam.x-30&&c.x<cam.x+W+30) drawCoin(c.x,c.y+Math.sin(time*3+c.x)*3,time*3+c.x*.02);
  for(const h of lv.hearts) if(!h.got){const s=1+Math.sin(time*6)*.08;ctx.save();ctx.globalCompositeOperation='lighter';drawGlow(h.x,h.y,40,'rgba(255,80,120,.4)');ctx.restore();spr('it_heart',h.x,h.y+Math.sin(time*3)*4,1,s);}
  for(const it of items){const y=it.y+(it.still?Math.sin(time*3+it.x)*4:0);ctx.save();ctx.globalCompositeOperation='lighter';drawGlow(it.x,y,44,it.k==='star'?`hsla(${(time*300)%360},100%,60%,.5)`:'rgba(255,230,120,.45)');ctx.restore();spr('it_'+it.k,it.x,y,1,.95);}
  if(lv.phone&&!lv.phone.got){ctx.save();ctx.globalCompositeOperation='lighter';drawGlow(lv.phone.x,lv.phone.y,60,'rgba(120,220,255,.5)');ctx.restore();drawPhone(lv.phone.x,lv.phone.y+Math.sin(time*4)*4,1.2);}
  for(const e of lv.enemies) drawEnemy(e);
  if(lv.boss) drawBoss(lv.boss);
  for(const s of shots){ spr('fireball',s.x,s.y,Math.sign(s.vx),s.big?1.5:.8); }
  for(const s of eshots){
    if(s.k==='wave'){ctx.fillStyle='rgba(255,220,150,.85)';ctx.beginPath();ctx.moveTo(s.x-26,s.y);ctx.quadraticCurveTo(s.x,s.y-50-Math.sin(s.t*30)*6,s.x+26,s.y);ctx.fill();ctx.fillStyle='rgba(255,140,40,.8)';ctx.beginPath();ctx.moveTo(s.x-16,s.y);ctx.quadraticCurveTo(s.x,s.y-28,s.x+16,s.y);ctx.fill();}
    else if(s.k==='shur'){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.t*20);ctx.fillStyle='#ccd';star(0,0,12);ctx.restore();}
    else {ctx.save();ctx.translate(s.x,s.y);ctx.rotate(Math.atan2(s.vy,s.vx));ctx.fillStyle=s.big?'#888':'#e8d79a';ctx.strokeStyle='#5a4a20';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-10,-4);ctx.lineTo(-10,4);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
  }
  drawPlayer();
  for(const q of parts){const a=Math.max(0,q.life/q.max);ctx.globalAlpha=a;ctx.fillStyle=q.col;
    if(q.coin){drawCoin(q.x,q.y,time*20);} else if(q.star){star(q.x,q.y,q.r+2);} else {ctx.beginPath();ctx.arc(q.x,q.y,q.r*(.5+a*.5),0,7);ctx.fill();}}
  ctx.globalAlpha=1;
  for(const u of popups){ctx.globalAlpha=Math.max(0,1-u.t/1.2);text(u.txt,u.x,u.y-u.t*45,u.txt.length>12?20:24,u.col||'#fff');}
  ctx.globalAlpha=1;
  ctx.restore();
}
function star(x,y,r){ctx.beginPath();for(let i=0;i<10;i++){const a=i/10*Math.PI*2-Math.PI/2,rr2=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}ctx.closePath();ctx.fill();}
function drawHUD(){
  const p=player;
  ctx.fillStyle='rgba(20,10,40,.4)';rr(14,12,262,50,25);ctx.fill();
  for(let i=0;i<3;i++) spr('it_heart',44+i*40,37,1,.8,i<p.hp?1:.25);
  drawCoin(176,37,time*3); text('x'+p.coins,198,38,26,'#fff','left');
  ctx.fillStyle='rgba(20,10,40,.4)';rr(W-300,12,286,50,25);ctx.fill();
  text(LEVELS[curLevel].name,W-157,38,lv.L.name.length>16?19:24,'#ffe066');
  // powers
  let px=24; for(const k in p.pw){ if(p.pw[k]>0){ ctx.fillStyle='rgba(20,10,40,.4)';rr(px-8,70,60,62,14);ctx.fill(); spr('it_'+k,px+22,96,1,.7);
    ctx.fillStyle='#333';ctx.fillRect(px,122,44,5);ctx.fillStyle='#7df';ctx.fillRect(px,122,44*p.pw[k]/POWERS[k].t,5); px+=68; } }
  const b=lv.boss; if(b&&lv.arena&&lv.arena.on&&b.alive){
    ctx.fillStyle='rgba(20,10,40,.6)';rr(W/2-260,H-58,520,44,20);ctx.fill();
    ctx.fillStyle='#401020';rr(W/2-240,H-34,480,14,7);ctx.fill();
    ctx.fillStyle=b.hp<b.max/2?'#ff4b4b':'#ff8a1f';rr(W/2-240,H-34,480*Math.max(0,b.hp)/b.max,14,7);ctx.fill();
    text(b.name,W/2,H-46,18,'#fff');
  }
  if(flash>0){ctx.fillStyle=`rgba(255,40,60,${Math.min(.4,flash)})`;ctx.fillRect(0,0,W,H);}
}
function panel(x,y,w,h){ctx.fillStyle='rgba(30,16,70,.85)';rr(x,y,w,h,24);ctx.fill();ctx.strokeStyle='#ffd23f';ctx.lineWidth=4;rr(x,y,w,h,24);ctx.stroke();}

/* ================= STORY ================= */
const STORY={
 intro:[
  {th:0,who:'idle',t:['Itaú de Minas, um dia tranquilo na Zicão Store...','O Thiago tava arrumando a vitrine de iPhones','novinhos, quando de repente...']},
  {th:3,vil:'boss_i',t:['O malvado ROBÔ SUCATÃO invadiu a loja','e roubou TODOS os iPhones!','"Hahaha! Agora eles viram sucata!"']},
  {th:3,vil:'mon_w0',vs:2,t:['Ele espalhou os iPhones com os capangas dele:','o Monstrão Roxo, o Rei Cacto','e o temido Mestre Ninja.']},
  {th:0,who:'combo2',t:['Mas mexeu com a loja errada!','Thiago parte pra recuperar cada iPhone','na base do soco, chute e kung fu! 🥋']},
  {th:0,who:'idle',t:['A: pular (aperte 2x no ar = pulo duplo)','B/X: soco  •  3x seguidos = combo','No ar + B: voadora  •  Baixo + B: pisão','Segure B e solte: BOLA DE FOGO!']}
 ],
 after:[
  [{th:0,vil:'mon_h',vs:2,t:['MONSTRÃO ROXO: "Grrr... isso não acabou!','O Rei Cacto vai te espetar no deserto!"']},{th:1,who:'run0',t:['1º iPhone recuperado!','Rumo ao Deserto do Sol...']}],
  [{th:1,vil:'cac_d',vs:2,t:['REI CACTO: "Ai ai ai... meus espinhos!','O Mestre Ninja vai acabar com você!"']},{th:2,who:'kick1',t:['2º iPhone recuperado!','Agora a Noite Doce. Cuidado com os ninjas!']}],
  [{th:2,vil:'nin_h',vs:2,t:['MESTRE NINJA: "Você luta bem, Thiago...','Mas o Robô Sucatão te espera na fábrica dele!"']},{th:3,who:'combo2',t:['3º iPhone recuperado!','Hora de acabar com o Sucatão de vez!']}],
  [{th:3,vil:'boss_t',t:['ROBÔ SUCATÃO: "Bzzzt... sistema... danificado...','Os iPhones... são... seus..."']},
   {th:0,who:'jump',t:['O Thiago recuperou TODOS os iPhones!','A Zicão Store reabriu com promoção pra geral!','🎉 FIM! Valeu por jogar! 🎉']}]
 ]
};
function startStory(pages,next){story={pages,i:0,t:0,next};state='story';stateT=0;}
function drawStory(dt){
  const pg=story.pages[story.i]; story.t+=dt; titleT+=dt;
  drawBG(THEMES[pg.th],titleT*30,0,titleT);
  const th=THEMES[pg.th]; ctx.fillStyle=th.dirt;ctx.fillRect(0,H-80,W,80);ctx.fillStyle=th.grass;ctx.fillRect(0,H-80,W,12);
  if(pg.who) spr(pg.who,240,H-78,1,1.9+Math.sin(titleT*3)*.02);
  if(pg.vil) spr(pg.vil,W-230,H-78,1,(pg.vs||1)*(pg.vil.startsWith('boss')?1:1.2));
  panel(40,30,W-80,175);
  const n=Math.floor(story.t*45); let left=n;
  pg.t.forEach((l,i)=>{const s=l.slice(0,Math.max(0,left)); left-=l.length; text(s,W/2,72+i*36,pg.t.length>3?22:26,'#fff');});
  if(Math.floor(titleT*2)%2===0) text('A ▶',W-90,180,20,'#ffe066');
}
function updateStory(){
  const total=story.pages[story.i].t.join('').length;
  if(story.t<.15) return;
  if(tap.jump||tap.attack){ if(story.t*45<total){story.t=99;} else { story.i++; story.t=0; SFX.select(); if(story.i>=story.pages.length){ const nx=story.next; story=null; nx(); } } }
  else if(tap.pause||tap.back){ const nx=story.next; story=null; nx(); }
}

/* ================= SCREENS ================= */
let titleT=0;
function drawTitle(dt){
  titleT+=dt; const th=THEMES[LEVELS[selLevel].theme];
  drawBG(th,titleT*60,0,titleT);
  ctx.fillStyle=th.dirt;ctx.fillRect(0,H-90,W,90);ctx.fillStyle=th.grass2;ctx.fillRect(0,H-90,W,18);ctx.fillStyle=th.grass;ctx.fillRect(0,H-90,W,13);
  const by=Math.abs(Math.sin(titleT*3.2))*70;
  spr(by>8?'jump':'idle',W/2-200,H-88-by,1,1.3);
  spr('boss_i',W/2+250,H-86,1,.9);
  for(let i=0;i<5;i++)if(i!==2)drawCoin(W/2-220+i*110,H-150+Math.sin(titleT*3+i)*8,titleT*3+i);
  const s=1+Math.sin(titleT*2)*.03;
  ctx.save();ctx.translate(W/2,92);ctx.scale(s,s);
  text('AVENTURA',0,-8,62,'#ffd23f','center','#3a1670'); text('DO ZICÃO',0,54,76,'#ff7a12','center','#3a1670');
  ctx.restore();
  panel(W/2-240,190,480,100);
  text((selLevel>0?'◀  ':'    ')+'FASE '+(selLevel+1)+(selLevel<unlocked-1?'  ▶':'    '),W/2,222,32,'#fff');
  text(LEVELS[selLevel].name+(best[selLevel]!=null?'  •  recorde: '+best[selLevel]:''),W/2,262,20,'#ffe066');
  if(Math.floor(titleT*2)%2===0) text('Aperte  A  /  OK  pra jogar',W/2,325,26,'#fff');
  text('📱 iPhones recuperados: '+phones+'/4',W/2,365,18,'#fff');
}
function updateTitle(){
  if(tap.left&&selLevel>0){selLevel--;SFX.select();}
  if(tap.right&&selLevel<unlocked-1){selLevel++;SFX.select();}
  if(tap.jump||tap.attack||tap.pause){audioInit();SFX.coin();
    if(selLevel===0) startStory(STORY.intro,()=>startLevel(0)); else startLevel(selLevel);}
  if(tap.back){ try{ if(window.Android&&Android.exit) Android.exit(); }catch(e){} }
}
/* ================= LOOP ================= */
let last=performance.now(),acc=0;const STEP=1/60;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now; if(dt>.1)dt=.1;
  readInput(); for(const a of ACTS) if(tch[a]) held[a]=true;
  musicTick();
  ctx.setTransform(S,0,0,S,0,0);
  if(state==='title'){updateTitle();if(state==='title'){drawTitle(dt);drawTouch();}return;}
  if(state==='story'){updateStory();if(state==='story'){drawStory(dt);drawTouch();return;}}
  stateT+=dt;
  if(state==='intro'){
    acc=0; updateCam(1); drawWorld(); drawHUD();
    ctx.fillStyle='rgba(0,0,0,'+Math.max(0,.6-stateT*.3)+')';ctx.fillRect(0,0,W,H);
    const k=Math.min(1,stateT*3);
    ctx.save();ctx.translate(W/2,H/2-30);ctx.scale(k,k);
    text('FASE '+(curLevel+1),0,-30,40,'#fff');text(LEVELS[curLevel].name,0,30,58,'#ffd23f');
    text('Chefão: '+BOSSES[LEVELS[curLevel].boss].name,0,82,22,'#ff9a9a');ctx.restore();
    if(stateT>2.2||(stateT>.4&&(tap.jump||tap.attack))) {state='play';stateT=0;}
    drawTouch(); return;
  }
  if(state==='play'){
    if(tap.pause||tap.back){state='pause';SFX.pause();musicStop();}
    else if(hitStop>0){ hitStop-=dt; }
    else{
      acc+=dt; let first=true;
      let n=0; while(acc>=STEP&&n<4){updatePlay(STEP,first);first=false;acc-=STEP;n++;if(state!=='play')break;} if(acc>STEP*4)acc=0;
      updateFx(dt); updateCam(dt);
    }
    drawWorld(); drawHUD(); drawTouch(); return;
  }
  if(state==='pause'){
    drawWorld(); drawHUD(); ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,H);
    panel(W/2-260,H/2-130,520,260);
    text('PAUSA',W/2,H/2-80,52,'#ffd23f');
    text('A  →  continuar',W/2,H/2-15,24,'#fff');
    text('B  →  sair pro menu',W/2,H/2+25,24,'#fff');
    text('Soco: B • Combo: B B B • Voadora: pulo + B',W/2,H/2+70,17,'#ffe066');
    text('Pisão: baixo + B • Bola de fogo: segura B',W/2,H/2+96,17,'#ffe066');
    if(tap.jump||tap.pause||tap.back){state='play';SFX.select();const ar=lv.arena&&lv.arena.on;musicStart(pw('star')||ar?4:LEVELS[curLevel].song,pw('star')?1.35:1);}
    else if(tap.attack){state='title';titleT=0;selLevel=curLevel;musicStart(3);SFX.select();}
    drawTouch(); return;
  }
  if(state==='clear'){
    player.walk+=dt*8; updateFx(dt); time+=dt;
    drawWorld(); drawHUD();
    if(stateT>1.4){
      const k=Math.min(1,(stateT-1.4)*3);ctx.fillStyle='rgba(0,0,0,'+(.4*k)+')';ctx.fillRect(0,0,W,H);
      ctx.save();ctx.translate(W/2,H/2);ctx.scale(k,k);
      panel(-280,-150,560,300);
      text('FASE COMPLETA!',0,-95,46,'#ffd23f');
      drawCoin(-70,-20,time*3);text(player.coins+' / '+lv.totalCoins,30,-18,38,'#fff');
      text('💀 '+lv.deaths+(lv.deaths===0?'  SEM MORRER!':''),0,85,18,lv.deaths===0?'#7dff9a':'#fff');
      const st=player.coins>=lv.totalCoins?3:player.coins>=lv.totalCoins*.6?2:1;
      for(let i=0;i<3;i++){ctx.fillStyle=i<st?'#ffd23f':'rgba(255,255,255,.2)';star(-70+i*70,50,26);}
      if(Math.floor(stateT*2)%2===0)text('A  →  continuar',0,118,22,'#fff');
      ctx.restore();
      if(stateT>2&&(tap.jump||tap.attack)){
        SFX.select(); const L=curLevel;
        startStory(STORY.after[L],()=>{ if(L<LEVELS.length-1){ selLevel=L+1; startLevel(L+1);} else {state='end';stateT=0;musicStart(3);} });
        musicStart(3);
      }
    }
    drawTouch(); return;
  }
  if(state==='end'){
    titleT+=dt; drawBG(THEMES[0],titleT*40,0,titleT);
    for(let i=0;i<3;i++)if(Math.random()<.06)parts.push({x:Math.random()*W,y:H,vx:0,vy:-300-Math.random()*200,life:1.4,max:1.4,r:5,col:['#ffd23f','#ff5d8f','#7df'][i],g:0,star:true});
    for(const q of parts){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;ctx.globalAlpha=Math.max(0,q.life/q.max);ctx.fillStyle=q.col;star(q.x,q.y,8);}ctx.globalAlpha=1;
    parts=parts.filter(q=>q.life>0);
    const by=Math.abs(Math.sin(titleT*3.2))*60;
    spr(by>8?'jump':'idle',W/2,H-60-by,1,1.6);
    for(let i=0;i<4;i++) drawPhone(W/2-240+i*160+(i>1?0:0),H-260+Math.sin(titleT*3+i)*10,1.1);
    text('VOCÊ ZEROU!',W/2,90,72,'#ffd23f','center','#3a1670');
    text('Todos os iPhones voltaram pra Zicão Store! 📱',W/2,160,26,'#fff');
    if(stateT>2&&Math.floor(stateT*2)%2===0)text('Aperte A pra voltar ao menu',W/2,H-24,22,'#fff');
    if(stateT>2&&(tap.jump||tap.attack)){state='title';titleT=0;selLevel=0;}
    drawTouch(); return;
  }
}
window.__appPause=()=>{clearInputs();if(state==='play'){state='pause';musicStop();}};
musicStart(3);
requestAnimationFrame(frame);
</script>
